name: Release Multi-Platform Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (.AppImage, .deb, .rpm)
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--bundles appimage,deb,rpm'
          # macOS Apple Silicon (M1/M2/M3/M4 aarch64)
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            args: '--bundles dmg,app'
          # macOS Intel (x86_64)
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            args: '--bundles dmg,app'
          # Windows x64 (.exe NSIS, .msi)
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse3-dev \
            fuse3 \
            rpm

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Application and Release Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'River v__VERSION__'
          releaseBody: 'River Multi-Platform Cloud Pool Storage System. See assets below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
