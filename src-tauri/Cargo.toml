[package]
name = "river"
version = "1.0.0"
description = "River — Designed by whiteruby — Google Drive Multi-Account Manager"
authors = ["whiteruby"]
edition = "2021"

[lib]
name = "river_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
url = "2.5"
dirs = "5.0"
open = "5.3"
keyring = "3.6"
machine-uid = "0.4"
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors"] }
futures-util = "0.3"
tempfile = "3.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
fuser = "0.15"
libc = "0.2"
mime_guess = "2.0"
